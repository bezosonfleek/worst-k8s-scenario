name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install flake8
        run: pip install flake8

      - name: Lint
        run: flake8 app/ 
        
      - Extract version from tag
        id: version
        if: startWith(github.ref, 'refs/tags/')
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT
      - name: Docker Login
        if github.event_name == 'push'
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
            context: .
            push: true
            tags: |
              ${{ secrets.DOCKER_USERNAME }}/k8s-test:latest
              ${{ secrets.DOCKER_USERNAME }}/k8s-test:${{ github.sha }}
              ${{ steps.version.outputs.version && format('{0}/k8s-test:{1}', secrets.DOCKER_USERNAME, steps.version.outputs.version) || '' }}